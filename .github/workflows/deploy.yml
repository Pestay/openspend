# Despliegue a producción al crear un tag de versión (ej. v0.4.0) sobre main. No corre checks:
# todo commit de main ya los pasó en su PR (el ruleset "Proteger main" lo exige).
name: Deploy

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Desplegar a Cloudflare
    runs-on: ubuntu-latest
    # El token de Cloudflare vive en este environment, que solo aceptan los tags v*.
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verificar que el tag apunta a un commit de main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::El tag $GITHUB_REF_NAME no apunta a un commit de main. Solo se despliega desde main."
            exit 1
          fi
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Verificar que el tag coincide con la versión de package.json
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "::error::El tag $GITHUB_REF_NAME no coincide con la versión de package.json ($expected)."
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - name: Aplicar migraciones de D1
        run: pnpm db:migrate:remote
      - name: Desplegar Worker
        run: pnpm run deploy
